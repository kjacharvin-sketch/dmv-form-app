<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NY DMV Form Filler</title>
<style>
body { font-family: Arial; padding: 20px; }
.section { display: none; }
.section.active { display: block; }
button { margin-top: 10px; padding: 10px; }
</style>
</head>
<body>

<h2>NY DMV Form Filler</h2>

<!-- SECTION 0 -->
<div class="section active">
  <h3>Vehicle Info</h3>
  <input id="vehicle_year" placeholder="Year"><br>
  <input id="vehicle_make" placeholder="Make"><br>
  <input id="vehicle_model" placeholder="Model"><br>
  <input id="vin" placeholder="VIN"><br>
  <button onclick="goTo(1)">Next</button>
</div>

<!-- SECTION 1 -->
<div class="section">
  <h3>Buyer</h3>
  <input id="buyer_name" placeholder="Buyer Name"><br>
  <input id="buyer_address" placeholder="Address"><br>
  <input id="buyer_city" placeholder="City"><br>
  <input id="buyer_zip" placeholder="ZIP"><br>
  <input id="buyer_county" placeholder="County"><br>
  <button onclick="goTo(0)">Back</button>
  <button onclick="goTo(2)">Next</button>
</div>

<!-- SECTION 2 -->
<div class="section">
  <h3>Seller</h3>
  <input id="seller_name" placeholder="Seller Name"><br>
  <input id="seller_address" placeholder="Address"><br>
  <input id="seller_city" placeholder="City"><br>
  <button onclick="goTo(1)">Back</button>
  <button onclick="goTo(3)">Next</button>
</div>

<!-- SECTION 3 -->
<div class="section">
  <h3>Transaction</h3>
  <input id="sale_price" type="number" placeholder="Sale Price"><br>
  <input id="tax_rate" type="number" step="0.0001" placeholder="Tax Rate"><br>
  <button onclick="goTo(2)">Back</button>
  <button onclick="goTo(4)">Next</button>
</div>

<!-- SECTION 4 -->
<div class="section">
  <h3>Review</h3>
  <button onclick="goTo(3)">Back</button>
  <button onclick="generateForms()">Generate PDFs</button>
</div>

<script>
let current = 0;

function goTo(n) {
  const sections = document.querySelectorAll('.section');
  sections.forEach((s, i) => {
    s.classList.toggle('active', i === n);
  });
  current = n;
}

function getVal(id) {
  const el = document.getElementById(id);
  return el ? el.value.trim() : '';
}

function gatherData() {
  return {
    vehicle_year: getVal('vehicle_year'),
    vehicle_make: getVal('vehicle_make'),
    vehicle_model: getVal('vehicle_model'),
    vin: getVal('vin'),

    buyer_name: getVal('buyer_name'),
    buyer_address: getVal('buyer_address'),
    buyer_city: getVal('buyer_city'),
    buyer_zip: getVal('buyer_zip'),
    buyer_county: getVal('buyer_county'),

    seller_name: getVal('seller_name'),
    seller_address: getVal('seller_address'),
    seller_city: getVal('seller_city'),

    sale_price: getVal('sale_price'),
    tax_rate: getVal('tax_rate')
  };
}

async function generateForms() {
  const data = gatherData();
  console.log("SENDING:", data);

  try {
    const response = await fetch('/generate', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(data)
    });

    const result = await response.json();
    console.log("RESULT:", result);

    if (result.success) {
      result.files.forEach(file => {
        window.open(`/download/${file}`, '_blank');
      });
    } else {
      alert(result.error || "Error generating forms");
    }

  } catch (err) {
    alert(err.message);
  }
}
</script>

</body>
</html>
