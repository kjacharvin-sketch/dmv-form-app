<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NY DMV Form Filler</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
/* === YOUR ORIGINAL STYLES (UNCHANGED) === */
*, *::before, ::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --ny-blue: #003087;
  --ny-gold: #C8A84B;
  --surface: #FAFAF9;
  --surface-2: #F0EEE9;
  --border: #D9D5CC;
  --text: #1A1917;

  --radius: 6px;

}

  font-family: 'DM Sans', sans-serif;

}

/ keep rest of your styling exactly as-is /
</style>
</head>

<body>

<!-- === YOUR ORIGINAL HTML UI (UNCHANGED) === -->
<!-- KEEP EVERYTHING YOU ALREADY HAVE HERE EXACTLY -->
<!-- I am NOT modifying layout, sections, or styling -->

<!-- ================= SCRIPT (FIXED ONLY) ================= -->

<script>
document.addEventListener('DOMContentLoaded', () => {

try {

let currentSection = 0;
const totalSections = 6;

/* NAV /
window.goTo = function(n) {
  document.querySelectorAll('.section-card').forEach((el, i) => {
    el.classList.toggle('active', i === n);
  });

  document.querySelectorAll('.nav-item').forEach((el, i) => {
    el.classList.toggle('active', i === n);
  });

  currentSection = n;

  const fill = document.getElementById('progressFill');
  if (fill) fill.style.width = ((n / (totalSections - 1)) * 100) + '%';

  if (n === 5) buildReview();
};

/ SAFE VALUE GET /
function getVal(id) {
  const el = document.getElementById(id);
  return el ? el.value.trim() : '';
}

/ REVIEW /
function buildReview() {
  const el = document.getElementById('review-content');
  if (!el) return;

  el.innerHTML =     <div>Vehicle: ${getVal('vehicle_year')} ${getVal('vehicle_make')} ${getVal('vehicle_model')}</div>     <div>Buyer: ${getVal('buyer_name')}</div>     <div>Seller: ${getVal('seller_name')}</div>  ;
}

/ DATA /
function gatherData() {
  return {
    vehicle_year: getVal('vehicle_year'),
    vehicle_make: getVal('vehicle_make'),
    vehicle_model: getVal('vehicle_model'),
    vin: getVal('vin'),
    buyer_name: getVal('buyer_name'),
    buyer_address: getVal('buyer_address'),
    buyer_city: getVal('buyer_city'),
    buyer_zip: getVal('buyer_zip'),
    buyer_county: getVal('buyer_county'),
    seller_name: getVal('seller_name'),
    seller_address: getVal('seller_address'),
    seller_city: getVal('seller_city')
  };
}

/ GENERATE */
window.generateForms = async function() {
  try {
    const data = gatherData();

    const res = await fetch('/generate', {
      method: 'POST',
      body: new URLSearchParams(data)
    });

    const result = await res.json();

    if (!result.success) {
      alert(result.error || "Error");
      return;
    }

    result.files.forEach(f => {
      window.open('/download/' + f, '_blank');
    });

  } catch (err) {
    alert(err.message);
  }
};

} catch (err) {
  console.error("SCRIPT CRASH:", err);
  document.body.innerHTML = "<h2 style='padding:20px'>Script crashed — check console</h2>";
}

});
</script>

</body>
</html>
