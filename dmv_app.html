<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NY DMV Form Filler</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
body {
  margin:0;
  font-family:'DM Sans', sans-serif;
  background:#f4f3ef;
}

/* HEADER */
.header {
  background:#0b3d91;
  color:white;
  padding:16px 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.header h2 {
  margin:0;
  font-size:18px;
}

.badges span {
  background:#1e4fbf;
  padding:4px 10px;
  border-radius:6px;
  margin-left:6px;
  font-size:12px;
}

/* LAYOUT */
.main {
  display:grid;
  grid-template-columns:220px 1fr;
  gap:24px;
  padding:24px;
}

/* SIDEBAR */
.sidebar {
  color:#777;
}

.nav-item {
  padding:10px;
  border-radius:6px;
  cursor:pointer;
}

.nav-item.active {
  background:white;
  color:#0b3d91;
  font-weight:600;
}

/* CARD */
.card {
  background:white;
  border-radius:10px;
  padding:24px;
  box-shadow:0 2px 6px rgba(0,0,0,0.08);
}

/* BUTTONS */
.btn {
  padding:12px 18px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

.btn-primary {
  background:#0b3d91;
  color:white;
  width:100%;
}

/* RESULTS */
.results {
  margin-top:20px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
}

.result-card {
  border:1px solid #ddd;
  border-radius:10px;
  padding:16px;
  text-align:center;
}

.error {
  color:red;
  font-size:12px;
}

.success {
  color:green;
}
</style>
</head>

<body>

<div class="header">
  <h2>New York State DMV — Form Filler</h2>
  <div class="badges">
    <span>DTF-802</span>
    <span>MV-82</span>
    <span>MV-912</span>
  </div>
</div>

<div class="main">

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="nav-item active" onclick="goTo(0)">Vehicle Info</div>
  <div class="nav-item" onclick="goTo(1)">Buyer / New Owner</div>
  <div class="nav-item" onclick="goTo(2)">Seller</div>
  <div class="nav-item" onclick="goTo(3)">Transaction</div>
  <div class="nav-item" onclick="goTo(4)">Tax & Fees</div>
  <div class="nav-item" onclick="goTo(5)">Review & Generate</div>
</div>

<!-- CONTENT -->
<div>

<!-- SECTION -->
<div class="card section active">
  <h3>Review & Generate</h3>

  <button class="btn btn-primary" onclick="generateForms()">
    Generate All 3 Forms ↗
  </button>

  <div class="results" id="results"></div>
</div>

</div>
</div>

<script>
function goTo(n){
  document.querySelectorAll('.nav-item').forEach((el,i)=>{
    el.classList.toggle('active',i===n);
  });
}

/* DATA (SAFE) */
function gatherData(){
  return {
    vehicle_year: "",
    vehicle_make: "",
    vehicle_model: "",
    vin: "",
    buyer_name: "",
    buyer_address: "",
    buyer_city: "",
    buyer_zip: "",
    buyer_county: "",
    seller_name: "",
    seller_address: "",
    seller_city: "",
    sale_price: "",
    tax_rate: ""
  };
}

/* SHOW RESULTS */
function showResults(result){
  const container = document.getElementById("results");

  container.innerHTML = result.files.map(f => `
    <div class="result-card">
      <h4>${f}</h4>
      <div class="success">✓ Ready</div>
      <a href="/download/${f}" target="_blank">Download</a>
    </div>
  `).join("");
}

/* SHOW ERROR CARDS */
function showError(){
  const container = document.getElementById("results");

  container.innerHTML = `
    <div class="result-card">
      <h4>MV-912</h4>
      <div class="error">✖ Error<br>Unknown error</div>
    </div>
    <div class="result-card">
      <h4>MV-82</h4>
      <div class="error">✖ Error<br>Unknown error</div>
    </div>
    <div class="result-card">
      <h4>DTF-802</h4>
      <div class="error">✖ Error<br>Unknown error</div>
    </div>
  `;
}

/* GENERATE */
async function generateForms(){
  try{
    const res = await fetch("/generate",{
      method:"POST",
      body:new URLSearchParams(gatherData())
    });

    const data = await res.json();

    if(data.success){
      showResults(data);
    }else{
      showError();
    }

  }catch(e){
    showError();
  }
}
</script>

</body>
</html>
