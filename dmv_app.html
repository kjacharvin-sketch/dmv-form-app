<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NY DMV Form Filler</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f5f5f5;
}

.header {
  background: #003087;
  color: white;
  padding: 15px;
  font-weight: bold;
}

.main {
  display: flex;
}

.sidebar {
  width: 200px;
  background: #eee;
  padding: 10px;
}

.nav-item {
  display: block;
  padding: 8px;
  margin-bottom: 5px;
  cursor: pointer;
  border-radius: 5px;
}

.nav-item.active {
  background: #003087;
  color: white;
}

.form-content {
  flex: 1;
  padding: 20px;
}

.section-card {
  display: none;
  background: white;
  padding: 20px;
  border-radius: 8px;
}

.section-card.active {
  display: block;
}

.btn {
  padding: 10px 15px;
  background: #003087;
  color: white;
  border: none;
  cursor: pointer;
  border-radius: 5px;
}
</style>
</head>

<body>

<div class="header">NY DMV Form Filler</div>

<div class="main">

  <div class="sidebar">
    <div class="nav-item active" onclick="goTo(0)">Vehicle</div>
    <div class="nav-item" onclick="goTo(1)">Buyer</div>
    <div class="nav-item" onclick="goTo(2)">Seller</div>
    <div class="nav-item" onclick="goTo(3)">Transaction</div>
    <div class="nav-item" onclick="goTo(4)">Tax</div>
    <div class="nav-item" onclick="goTo(5)">Review</div>
  </div>

  <div class="form-content">

    <div class="section-card active">
      <h2>Vehicle Info</h2>
      <input id="vehicle_year" placeholder="Year"><br><br>
      <input id="vehicle_make" placeholder="Make"><br><br>
      <input id="vehicle_model" placeholder="Model"><br><br>
      <input id="vin" placeholder="VIN"><br><br>
      <button class="btn" onclick="goTo(1)">Next</button>
    </div>

    <div class="section-card">
      <h2>Buyer</h2>
      <input id="buyer_name" placeholder="Name"><br><br>
      <input id="buyer_address" placeholder="Address"><br><br>
      <input id="buyer_city" placeholder="City"><br><br>
      <input id="buyer_zip" placeholder="ZIP"><br><br>
      <input id="buyer_county" placeholder="County"><br><br>
      <button class="btn" onclick="goTo(2)">Next</button>
    </div>

    <div class="section-card">
      <h2>Seller</h2>
      <input id="seller_name" placeholder="Name"><br><br>
      <input id="seller_address" placeholder="Address"><br><br>
      <input id="seller_city" placeholder="City"><br><br>
      <button class="btn" onclick="goTo(3)">Next</button>
    </div>

    <div class="section-card">
      <h2>Transaction</h2>
      <input id="sale_price" placeholder="Price"><br><br>
      <button class="btn" onclick="goTo(4)">Next</button>
    </div>

    <div class="section-card">
      <h2>Tax</h2>
      <input id="tax_rate" placeholder="Tax Rate"><br><br>
      <button class="btn" onclick="goTo(5)">Next</button>
    </div>

    <div class="section-card">
      <h2>Review & Generate</h2>
      <button class="btn" onclick="generateForms()">Generate</button>
    </div>

  </div>

</div>

<script>
let currentSection = 0;

function goTo(n) {
  document.querySelectorAll('.section-card').forEach((el, i) => {
    el.classList.toggle('active', i === n);
  });

  document.querySelectorAll('.nav-item').forEach((el, i) => {
    el.classList.toggle('active', i === n);
  });

  currentSection = n;
}

function gatherData() {
  return {
    vehicle_year: document.getElementById('vehicle_year').value,
    vehicle_make: document.getElementById('vehicle_make').value,
    vehicle_model: document.getElementById('vehicle_model').value,
    vin: document.getElementById('vin').value,
    buyer_name: document.getElementById('buyer_name').value,
    buyer_address: document.getElementById('buyer_address').value,
    buyer_city: document.getElementById('buyer_city').value,
    buyer_zip: document.getElementById('buyer_zip').value,
    buyer_county: document.getElementById('buyer_county').value,
    seller_name: document.getElementById('seller_name').value,
    seller_address: document.getElementById('seller_address').value,
    seller_city: document.getElementById('seller_city').value,
    sale_price: document.getElementById('sale_price').value,
    tax_rate: document.getElementById('tax_rate').value
  };
}

async function generateForms() {
  const data = gatherData();

  try {
    const response = await fetch('/generate', {
      method: 'POST',
      body: new URLSearchParams(data)
    });

    const result = await response.json();

    if (result.success) {
      result.files.forEach(file => {
        window.open('/download/' + file);
      });
    } else {
      alert(result.error);
    }

  } catch (err) {
    alert(err.message);
  }
}
</script>

</body>
</html>
