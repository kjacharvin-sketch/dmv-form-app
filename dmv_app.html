<!-- ONLY showing the FIXED parts so you don’t lose your mind scrolling -->

<script>
let currentSection = 0;
const totalSections = 6;

function goTo(n) {
  document.querySelectorAll('.section-card').forEach((el, i) => {
    el.classList.toggle('active', i === n);
  });
  document.querySelectorAll('.nav-item').forEach((el, i) => {
    el.classList.toggle('active', i === n);
  });
  currentSection = n;
  updateProgress();
  if (n === 5) buildReview();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function updateProgress() {
  const pct = (currentSection / (totalSections - 1)) * 100;
  document.getElementById('progressFill').style.width = pct + '%';
}

/* ================= HELPERS ================= */
function getVal(id) {
  const el = document.getElementById(id);
  return el ? el.value.trim() : '';
}

function getRadio(name) {
  const el = document.querySelector(`input[name="${name}"]:checked`);
  return el ? el.value : '';
}

function formatDate(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr + 'T00:00:00');
  return `${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}/${d.getFullYear()}`;
}

/* ================= TAX ================= */
function updateTaxCalc() {
  const price = parseFloat(getVal('sale_price')) || 0;
  const rate = parseFloat(getVal('tax_rate')) || 0;
  const el = document.getElementById('tax_estimate');

  if (price && rate) {
    const tax = price * rate;
    el.textContent = '$' + tax.toFixed(2);
  } else {
    el.textContent = '—';
  }
}

/* ================= REVIEW ================= */
function buildReview() {
  const container = document.getElementById('review-content');

  container.innerHTML = `
    <div>Vehicle: ${getVal('vehicle_year')} ${getVal('vehicle_make')} ${getVal('vehicle_model')}</div>
    <div>Buyer: ${getVal('buyer_name')}</div>
    <div>Seller: ${getVal('seller_name')}</div>
    <div>Price: $${getVal('sale_price')}</div>
  `;
}

/* ================= DATA ================= */
function gatherData() {
  return {
    vehicle_year: getVal('vehicle_year'),
    vehicle_make: getVal('vehicle_make'),
    vehicle_model: getVal('vehicle_model'),
    vin: getVal('vin'),

    buyer_name: getVal('buyer_name'),
    buyer_address: getVal('buyer_address'),
    buyer_city: getVal('buyer_city'),
    buyer_zip: getVal('buyer_zip'),
    buyer_county: getVal('buyer_county'),

    seller_name: getVal('seller_name'),
    seller_address: getVal('seller_address'),
    seller_city: getVal('seller_city'),

    sale_price: getVal('sale_price'),
    tax_rate: getVal('tax_rate')
  };
}

/* ================= ALERT ================= */
function showAlert(type, msg) {
  const box = document.getElementById('alert-box');
  box.className = `alert alert-${type} active`;
  box.textContent = msg;
}

/* ================= RESULTS ================= */
function showResults(result) {
  const card = document.getElementById('results-card');
  const grid = document.getElementById('results-grid');

  card.classList.add('active');

  let html = '';
  result.files.forEach(file => {
    html += `
      <div class="result-item">
        <div class="result-icon">📄</div>
        <div class="result-form-name">${file}</div>
        <div class="result-status status-ok">✓ Ready</div>
        <a class="btn btn-download" href="/download/${file}" target="_blank">
          Download
        </a>
      </div>
    `;
  });

  grid.innerHTML = html;
}

/* ================= GENERATE (FIXED) ================= */
async function generateForms() {
  const data = gatherData();

  const required = [
    'vehicle_year','vehicle_make','vehicle_model','vin',
    'buyer_name','buyer_address','buyer_city','buyer_zip','buyer_county',
    'seller_name','seller_address','seller_city'
  ];

  const missing = required.filter(k => !data[k]);

  if (missing.length) {
    showAlert('error', "Missing: " + missing.join(', '));
    return;
  }

  try {
    const response = await fetch('/generate', {
      method: 'POST',
      body: new URLSearchParams(data)
    });

    const result = await response.json();

    if (result.success) {
      result.files.forEach(file => {
        window.open(`/download/${file}`, '_blank');
      });
    } else {
      alert(result.error || "Error");
    }

  } catch (err) {
    alert(err.message);
  }
}
/* ================= INIT ================= */
document.addEventListener('DOMContentLoaded', () => {
  const price = document.getElementById('sale_price');
  const rate = document.getElementById('tax_rate');

  if (price) price.addEventListener('input', updateTaxCalc);
  if (rate) rate.addEventListener('input', updateTaxCalc);

  const today = new Date().toISOString().split('T')[0];
  const dateInput = document.getElementById('transaction_date_input');
  if (dateInput) dateInput.value = today;
});
</script>
