<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NY DMV Form Filler</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
body {
  margin:0;
  font-family:'DM Sans', sans-serif;
  background:#f4f3ef;
}

/* HEADER */
.header {
  background:#123d8d;
  color:white;
  padding:18px 28px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.header h2 {
  margin:0;
  font-size:16px;
}

.badges span {
  background:#1f4fb3;
  padding:6px 10px;
  border-radius:6px;
  margin-left:6px;
  font-size:11px;
}

/* LAYOUT */
.main {
  display:grid;
  grid-template-columns:220px 1fr;
  gap:24px;
  padding:24px;
}

/* SIDEBAR */
.sidebar {
  color:#777;
}

.nav-item {
  padding:10px;
  border-radius:6px;
  cursor:pointer;
}

.nav-item.active {
  background:white;
  color:#123d8d;
  font-weight:600;
}

/* CARD */
.card {
  background:white;
  border-radius:10px;
  padding:24px;
  box-shadow:0 2px 6px rgba(0,0,0,0.08);
}

/* INPUTS */
input {
  display:block;
  margin-bottom:12px;
  padding:10px;
  width:100%;
  border:1px solid #ccc;
  border-radius:6px;
}

/* BUTTON */
.btn {
  padding:12px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

.btn-primary {
  background:#123d8d;
  color:white;
  width:100%;
}

/* SECTIONS */
.section { display:none; }
.section.active { display:block; }

/* RESULTS */
.results {
  margin-top:20px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
}

.result-card {
  border:1px solid #ddd;
  border-radius:10px;
  padding:16px;
  text-align:center;
}

.error { color:red; font-size:12px; }
.success { color:green; }
</style>
</head>

<body>

<div class="header">
  <h2>New York State DMV — Form Filler</h2>
  <div class="badges">
    <span>DTF-802</span>
    <span>MV-82</span>
    <span>MV-912</span>
  </div>
</div>

<div class="main">

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="nav-item active" onclick="goTo(0)">Vehicle Info</div>
  <div class="nav-item" onclick="goTo(1)">Buyer</div>
  <div class="nav-item" onclick="goTo(2)">Seller</div>
  <div class="nav-item" onclick="goTo(3)">Transaction</div>
  <div class="nav-item" onclick="goTo(4)">Tax & Fees</div>
  <div class="nav-item" onclick="goTo(5)">Review</div>
</div>

<!-- CONTENT -->
<div>

<!-- VEHICLE -->
<div class="card section active">
  <h3>Vehicle Info</h3>
  <input id="vehicle_year" placeholder="Year">
  <input id="vehicle_make" placeholder="Make">
  <input id="vehicle_model" placeholder="Model">
  <input id="vin" placeholder="VIN">
  <button class="btn-primary" onclick="goTo(1)">Next →</button>
</div>

<!-- BUYER -->
<div class="card section">
  <h3>Buyer</h3>
  <input id="buyer_name" placeholder="Name">
  <input id="buyer_address" placeholder="Address">
  <input id="buyer_city" placeholder="City">
  <input id="buyer_zip" placeholder="ZIP">
  <input id="buyer_county" placeholder="County">
  <button onclick="goTo(0)">Back</button>
  <button class="btn-primary" onclick="goTo(2)">Next →</button>
</div>

<!-- SELLER -->
<div class="card section">
  <h3>Seller</h3>
  <input id="seller_name" placeholder="Name">
  <input id="seller_address" placeholder="Address">
  <input id="seller_city" placeholder="City">
  <button onclick="goTo(1)">Back</button>
  <button class="btn-primary" onclick="goTo(3)">Next →</button>
</div>

<!-- TRANSACTION -->
<div class="card section">
  <h3>Transaction</h3>
  <input id="sale_price" placeholder="Sale Price">
  <button onclick="goTo(2)">Back</button>
  <button class="btn-primary" onclick="goTo(4)">Next →</button>
</div>

<!-- TAX -->
<div class="card section">
  <h3>Tax & Fees</h3>
  <input id="tax_rate" placeholder="Tax Rate (0.08875)">
  <button onclick="goTo(3)">Back</button>
  <button class="btn-primary" onclick="goTo(5)">Next →</button>
</div>

<!-- REVIEW -->
<div class="card section">
  <h3>Review & Generate</h3>
  <button class="btn-primary" onclick="generateForms()">Generate All 3 Forms ↗</button>
  <div class="results" id="results"></div>
</div>

</div>
</div>

<script>
function goTo(n){
  document.querySelectorAll('.section').forEach((el,i)=>{
    el.classList.toggle('active', i===n);
  });

  document.querySelectorAll('.nav-item').forEach((el,i)=>{
    el.classList.toggle('active', i===n);
  });
}

function gatherData(){
  return {
    vehicle_year: document.getElementById('vehicle_year').value,
    vehicle_make: document.getElementById('vehicle_make').value,
    vehicle_model: document.getElementById('vehicle_model').value,
    vin: document.getElementById('vin').value,
    buyer_name: document.getElementById('buyer_name').value,
    buyer_address: document.getElementById('buyer_address').value,
    buyer_city: document.getElementById('buyer_city').value,
    buyer_zip: document.getElementById('buyer_zip').value,
    buyer_county: document.getElementById('buyer_county').value,
    seller_name: document.getElementById('seller_name').value,
    seller_address: document.getElementById('seller_address').value,
    seller_city: document.getElementById('seller_city').value,
    sale_price: document.getElementById('sale_price').value,
    tax_rate: document.getElementById('tax_rate').value
  };
}

function showResults(files){
  const el = document.getElementById('results');

  el.innerHTML = files.map(f => `
    <div class="result-card">
      <h4>${f}</h4>
      <div class="success">✓ Ready</div>
      <a href="/download/${f}" target="_blank">Download</a>
    </div>
  `).join('');
}

function showError(){
  const el = document.getElementById('results');

  el.innerHTML = `
    <div class="result-card"><h4>MV-912</h4><div class="error">Error</div></div>
    <div class="result-card"><h4>MV-82</h4><div class="error">Error</div></div>
    <div class="result-card"><h4>DTF-802</h4><div class="error">Error</div></div>
  `;
}

async function generateForms(){
  try{
    const res = await fetch('/generate',{
      method:'POST',
      body:new URLSearchParams(gatherData())
    });

    const data = await res.json();

    if(data.success){
      showResults(data.files);
    } else {
      showError();
    }

  }catch{
    showError();
  }
}
</script>

</body>
</html>
