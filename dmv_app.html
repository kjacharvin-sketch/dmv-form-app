<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NY DMV Form Filler</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; margin:0; padding:0; }

body {
  font-family: 'DM Sans', sans-serif;
  background: #F3F4F6;
  color: #111;
}

/* HEADER /
.header {
  background: #0B3A82;
  color: white;
  padding: 14px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.header-title {
  font-weight: 600;
  font-size: 16px;
}

.header-badges span {
  background: rgba(255,255,255,0.2);
  padding: 4px 10px;
  margin-left: 6px;
  border-radius: 6px;
  font-size: 12px;
}

/ LAYOUT /
.container {
  display: grid;
  grid-template-columns: 220px 1fr;
  max-width: 1100px;
  margin: 30px auto;
  gap: 24px;
}

/ SIDEBAR /
.sidebar {
  padding-top: 10px;
}

.step {
  padding: 10px;
  border-radius: 8px;
  margin-bottom: 6px;
  font-size: 14px;
  color: #666;
}

.step.active {
  background: white;
  color: #0B3A82;
  font-weight: 600;
  border: 1px solid #ddd;
}

/ CARD /
.card {
  background: white;
  border-radius: 12px;
  padding: 28px;
  border: 1px solid #E5E7EB;
}

.card h2 {
  font-size: 20px;
  margin-bottom: 8px;
}

.card small {
  color: #666;
}

/ FORM /
.row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-top: 20px;
}

input, select {
  width: 100%;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #ccc;
  font-size: 14px;
}

/ BUTTON /
.btn {
  background: #0B3A82;
  color: white;
  padding: 12px 20px;
  border-radius: 8px;
  border: none;
  margin-top: 20px;
  cursor: pointer;
}

.btn.secondary {
  background: #eee;
  color: #333;
}

/ RESULTS */
.results {
  margin-top: 20px;
}

</style>
</head>

<body>

<div class="header">
  <div class="header-title">New York State DMV — Form Filler</div>
  <div class="header-badges">
    <span>DTF-802</span>
    <span>MV-82</span>
    <span>MV-912</span>
  </div>
</div>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="step active">Vehicle Info</div>
  <div class="step">Buyer / New Owner</div>
  <div class="step">Seller</div>
  <div class="step">Transaction</div>
  <div class="step">Tax & Fees</div>
  <div class="step">Review</div>
</div>

<!-- MAIN -->
<div class="card">

<h2>Tax & Fees</h2>
<small>NYS sales tax rate for the buyer's county of residence.</small>

<div class="row">
  <select id="county">
    <option>New York City (8.875%)</option>
    <option>Nassau (8.875%)</option>
    <option>Suffolk (8.875%)</option>
  </select>

  <input id="tax_rate" placeholder="0.08875">
</div>

<div class="row">
  <input id="sale_price" placeholder="Sale Price">
</div>

<button class="btn" onclick="generateForms()">Review & Generate →</button>

<div class="results" id="results"></div>

</div>

</div>

<script>
function getVal(id){
  return document.getElementById(id)?.value || '';
}

async function generateForms(){
  const data = {
    county: getVal('county'),
    tax_rate: getVal('tax_rate'),
    sale_price: getVal('sale_price')
  };

  try {
    const res = await fetch('/generate', {
      method:'POST',
      body: new URLSearchParams(data)
    });

    const result = await res.json();

    if(!result.success){
      alert(result.error);
      return;
    }

    const box = document.getElementById('results');

    box.innerHTML = result.files.map(f =>
      <div><a href="/download/${f}" target="_blank">${f}</a></div>
    ).join('');

  } catch(e){
    alert(e.message);
  }
}
</script>

</body>
</html>
